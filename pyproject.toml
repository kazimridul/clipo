[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clipo"
version = "0.2.0"
description = "A private, native Linux clipboard manager"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "Pillow>=11,<13", "qrcode>=8,<9", "python-xlib>=0.33,<1", "Pygments>=2.18,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "zxing-cpp>=2.3,<4"]
build = ["pyinstaller>=6.16,<7"]

[project.scripts]
clipo = "clipo.application.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clipo = ["resources/*.svg", "resources/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

