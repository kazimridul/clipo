name: Linux verification and Ubuntu build
on: [push, pull_request, workflow_dispatch]
jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Desktop and OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 tesseract-ocr tesseract-ocr-eng
      - name: Install
        run: python -m pip install -e '.[test,build]'
      - name: Tests
        run: QT_QPA_PLATFORM=offscreen python -m pytest -q
      - name: Real cross-process X11 probe
        run: xvfb-run -a env -u WAYLAND_DISPLAY QT_QPA_PLATFORM=xcb XDG_SESSION_TYPE=x11 CLIPO_ISOLATED_DISPLAY=1 python scripts/probe_x11.py
      - name: Build Ubuntu 24.04 Debian package
        run: python scripts/package_linux.py
      - uses: actions/upload-artifact@v4
        with:
          name: clipo-ubuntu-24.04
          path: |
            dist/*.deb
            dist/build-manifest.json
